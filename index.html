<div id="loginPage" class="login-page">
  <div class="login-hero">
    <div class="hero-content">
      <div class="brand-logo"><i data-lucide="sprout"></i></div>
      <h1>Mandiri Farm</h1>
      <p>Integrated Management System</p>
      <span>Better Data, Smoother Business</span>
    </div>
  </div>
  <div class="login-form">
    <div class="login-box">
      <div class="mobile-brand"><i data-lucide="sprout"></i> Mandiri Farm</div>
      <h2>Welcome Back,</h2>
      <p>Please login to your account</p>
      <form id="loginForm">
        <label>Username / Email</label>
        <input id="username" type="text" placeholder="Enter your username or email" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <label class="remember"><input type="checkbox"> Remember me</label>
        <button class="primary-btn full-btn">Login</button>
      </form>
      <small class="login-hint">Demo: admin / admin123</small>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="sprout"></i></div>
      <div><strong>Mandiri Farm</strong><small>Management System</small></div>
    </div>

    <nav id="navigation">
      <div class="nav-group">
        <button class="nav-link active" data-page="Dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
        <button class="nav-link" data-page="Customer Management"><i data-lucide="users"></i>Customer Management</button>
        <button class="nav-link" data-page="Sales Management"><i data-lucide="shopping-cart"></i>Sales Management</button>
        <button class="nav-link" data-page="Finance Management"><i data-lucide="wallet"></i>Finance Management</button>
        <button class="nav-link" data-page="Supplier Management"><i data-lucide="truck"></i>Supplier Management</button>
        <button class="nav-link" data-page="Purchase Management"><i data-lucide="shopping-bag"></i>Purchase Management</button>
        <button class="nav-link" data-page="Production Management"><i data-lucide="factory"></i>Production Management</button>
        <button class="nav-link" data-page="Inventory Management"><i data-lucide="package"></i>Inventory Management</button>
        <button class="nav-link" data-page="Delivery Management"><i data-lucide="truck"></i>Delivery Management</button>
        <button class="nav-link" data-page="Employee Management"><i data-lucide="contact"></i>Employee Management</button>
        <button class="nav-link" data-page="Reports & Analytics"><i data-lucide="chart-no-axes-combined"></i>Reports & Analytics</button>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-link" data-page="My Profile"><i data-lucide="user-round"></i>My Profile</button>
      <button class="nav-link" data-page="Settings"><i data-lucide="settings"></i>Settings</button>
      <button class="nav-link logout-link" id="logoutBtn"><i data-lucide="log-out"></i>Logout</button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
      <div class="breadcrumb" id="breadcrumb">Dashboard</div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications"><i data-lucide="bell"></i></button>
        <div class="admin-info">
          <div class="avatar">AK</div>
          <div><strong>Admin</strong><small>Owner</small></div>
        </div>
      </div>
    </header>

    <section id="content" class="content"></section>
    <footer>© 2026 Mandiri Farm Management System. All rights reserved.</footer>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Add Data</h3>
      <button class="icon-btn" id="closeModal"><i data-lucide="x"></i></button>
    </div>
    <form id="modalForm">
      <div id="modalFields" class="form-grid"></div>
      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="cancelModal">Cancel</button>
        <button type="submit" class="primary-btn">Save Data</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>
